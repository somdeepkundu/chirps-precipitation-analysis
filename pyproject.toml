[project]
name = "chirps-precipitation-analysis"
version = "1.0.0"
description = "Tutorial for analyzing and visualizing global precipitation data from CHIRPS using Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Somdeep Kundu", email = "your-email@example.com"}
]
keywords = [
    "climate",
    "geospatial",
    "GIS",
    "precipitation",
    "CHIRPS",
    "raster",
    "cartography",
    "data-visualization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]

dependencies = [
    "rasterio>=1.3.0",
    "rio-cogeo>=7.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "cartopy>=0.21.0",
    "shapely>=2.0.0",
    "pyproj>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/chirps-precipitation-analysis"
Documentation = "https://github.com/yourusername/chirps-precipitation-analysis#readme"
Repository = "https://github.com/yourusername/chirps-precipitation-analysis.git"
Issues = "https://github.com/yourusername/chirps-precipitation-analysis/issues"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# UV configuration
python-version = "3.10"
